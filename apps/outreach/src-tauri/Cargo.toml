[package]
name = "outreach-app"
version = "0.1.0"
description = "Outreach — standalone app"
authors = ["Altramanera"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "outreach_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "board-cli"
path = "src/bin/board_cli.rs"

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.1", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
notify = "6"
notify-debouncer-mini = "0.4"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
slug = "0.1"
trash = "5"
dashmap = "6"
portable-pty = "0.8"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.31", features = ["bundled"] }
postgres = "0.19"
postgres-native-tls = "0.5"
native-tls = "0.2"

[dev-dependencies]
tempfile = "3"
